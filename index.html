<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/e0a51e2fde.js" crossorigin="anonymous"></script>
</head>

<body>

    <div class="main">

        <div class="calculator">
            <i class="fa-solid fa-calculator"></i>
            <h3>Calculator</h3>
        </div>

        <div class="main-box">
            <div class="inner" id="history"></div>
            <h1 id="display">0</h1>
        </div>

        <div class="bocx">
            <div class="box clear" id="box1">
                <h3>C</h3>
            </div>
            <div class="box" id="box2">
                <h3>±</h3>
            </div>
            <div class="box" id="box3">
                <h3>%</h3>
            </div>
            <div class="box operator" id="box4">
                <h3>÷</h3>
            </div>

            <div class="box" id="box5">
                <h3>7</h3>
            </div>
            <div class="box" id="box6">
                <h3>8</h3>
            </div>
            <div class="box" id="box7">
                <h3>9</h3>
            </div>
            <div class="box operator" id="box8">
                <h3>×</h3>
            </div>

            <div class="box" id="box9">
                <h3>4</h3>
            </div>
            <div class="box" id="box10">
                <h3>5</h3>
            </div>
            <div class="box" id="box11">
                <h3>6</h3>
            </div>
            <div class="box operator" id="box12">
                <h3>−</h3>
            </div>

            <div class="box" id="box13">
                <h3>1</h3>
            </div>
            <div class="box" id="box14">
                <h3>2</h3>
            </div>
            <div class="box" id="box15">
                <h3>3</h3>
            </div>
            <div class="box operator" id="box16">
                <h3>+</h3>
            </div>

            <div class="box zero" id="box17">
                <h3>0</h3>
            </div>
            <div class="box" id="box19">
                <h3>.</h3>
            </div>
            <div class="box equal" id="box20">
                <h3>=</h3>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
